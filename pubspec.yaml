name: attendance_flow
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/launcher_icon.png"
  adaptive_icon_background: "#6122D5"
  adaptive_icon_foreground: "assets/icon/launcher_icon.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/launcher_icon.png"
    background_color: "#6122D5"
    theme_color: "#4F7EFF"
  windows:
    generate: true
    image_path: "assets/icon/launcher_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

